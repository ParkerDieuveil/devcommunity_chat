name: devcommunitychat
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  firebase_core: ^4.14.0
  go_router: ^18.0.1
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  shared_preferences: ^2.5.5
  firebase_storage: ^13.6.0
  image_picker: ^1.2.3
  image: ^4.10.1
  mime: ^2.1.0
  flutter_svg: ^2.3.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/LogoChat.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/logo/LogoChat.png
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: true
    image_path: assets/logo/LogoChat.png
  macos:
    generate: true
    image_path: assets/logo/LogoChat.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/
